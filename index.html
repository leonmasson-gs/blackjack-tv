<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Hand</title>
<link rel="preload" href="/fonts/young-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Young Serif";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/young-serif-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:100 900;font-display:swap;src:url(/fonts/hanken-grotesk-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
</style>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#EDF1EE; --surface:#FFFFFF; --ink:#13201B; --muted:#55665F; --line:#CCD7D1; --line-strong:#76877F;
  --felt:#1D5B47; --felt-2:#154636; --felt-ink:#EAF4EE; --felt-muted:#BCD8CA;
  --card:#FCFBF7; --red:#C2362F; --black:#1A1F1D;
  --accent:#F2B440; --accent-ink:#2A1F00; --accent-hover:#F7C45E;
  --good:#166B45; --good-bg:#DDF1E7; --warn:#8F6200; --warn-bg:#FBEFCF; --bad:#B63229; --bad-bg:#F8DEDA;
  --focus:#1B5FD6; --placeholder:#8F6200;
  --font-ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Young Serif",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0E1513; --surface:#17211E; --ink:#E7EEEA; --muted:#9DB0A7; --line:#2B3B36; --line-strong:#71867D;
    --good:#53CC95; --good-bg:#16382B; --warn:#EBC15E; --warn-bg:#3A2F10; --bad:#F0877E; --bad-bg:#40201C;
    --focus:#7AA8FF; --placeholder:#EBC15E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0E1513; --surface:#17211E; --ink:#E7EEEA; --muted:#9DB0A7; --line:#2B3B36; --line-strong:#71867D;
  --good:#53CC95; --good-bg:#16382B; --warn:#EBC15E; --warn-bg:#3A2F10; --bad:#F0877E; --bad-bg:#40201C;
  --focus:#7AA8FF; --placeholder:#EBC15E; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.15;margin:0}
p{margin:0 0 .75em}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 0 10px}
.brand{background:none;border:0;padding:4px 0;font-family:var(--font-display);font-size:1.45rem;color:var(--ink)}
.top nav{display:flex;gap:4px}
.link{background:none;border:0;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500;font-size:.9rem}
.link:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.top .link,.row>.link{min-height:44px;display:inline-flex;align-items:center}
.link[aria-current="page"]{color:var(--ink);font-weight:700}

/* table + cards */
.table{background:var(--felt);color:var(--felt-ink);border-radius:22px;padding:18px 18px 20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 -14px 30px rgba(0,0,0,.18)}
.seat{display:flex;flex-direction:column;gap:8px}
.seat + .seat{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.seat-label{display:flex;align-items:center;justify-content:space-between;font-size:.9rem;color:var(--felt-muted);font-weight:500}
.pill{background:rgba(0,0,0,.28);color:var(--felt-ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.95rem}
.cards{display:flex;gap:10px}
.card{width:68px;height:96px;border-radius:9px;background:var(--card);color:var(--black);position:relative;display:flex;flex-direction:column;align-items:flex-start;padding:7px 8px;box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.22);font-family:var(--font-display)}
.card.red{color:var(--red)}
.card .rk{font-size:1.65rem;line-height:1}
.card .su{font-size:1.25rem;line-height:1.1}
.card .big{position:absolute;right:8px;bottom:6px;font-size:1.9rem;opacity:.9}
.card.back{background:repeating-linear-gradient(45deg,#2A6E58 0 6px,#235E4A 6px 12px);border:4px solid var(--card)}
@media (prefers-reduced-motion:no-preference){
  .card{animation:deal .34s cubic-bezier(.2,.8,.3,1) both;animation-delay:var(--d,0s)}
  @keyframes deal{from{opacity:0;transform:translateY(-14px) rotate(-4deg)}to{opacity:1;transform:none}}
}

/* hero on home */
.hero{margin:6px 0 18px}
.hero h1{font-size:2.3rem;margin:6px 0 8px}
.hero p{font-size:1.05rem;color:var(--muted);max-width:44ch}
.ask{margin:14px 0 0;font-family:var(--font-display);font-size:1.15rem;color:var(--felt-ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:1rem}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--ink)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.block{display:flex;width:100%}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;background:var(--surface);border:2px solid var(--line-strong);border-radius:14px;min-height:76px}
.act:hover{border-color:var(--ink)}
.act b{font-family:var(--font-display);font-weight:400;font-size:1.2rem}
.act span{font-size:.875rem;color:var(--muted);text-align:center;line-height:1.25}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack>*+*{margin-top:14px}

/* progress */
.dots{display:flex;gap:6px;margin:4px 0 12px;align-items:center}
.dot{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dot.done{background:var(--ink)}
.dot.now{background:var(--accent)}
.dots .n{font-size:.875rem;color:var(--muted);margin-left:6px;white-space:nowrap}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.verdict{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px 3px 8px;font-weight:700;font-size:.9rem}
.badge.g{background:var(--good-bg);color:var(--good)}
.badge.y{background:var(--warn-bg);color:var(--warn)}
.badge.r{background:var(--bad-bg);color:var(--bad)}
.verdict h2{font-size:1.5rem}
.evs{display:grid;gap:8px;margin:12px 0 4px}
.ev{display:grid;grid-template-columns:62px 1fr 52px;gap:8px;align-items:center;font-size:.92rem}
.ev .nm{font-weight:600}
.track{position:relative;height:22px;background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:6px}
.track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.55}
.bar{position:absolute;top:3px;bottom:3px;border-radius:4px;background:var(--muted);opacity:.55}
.ev.best .bar{background:var(--good);opacity:1}
.ev.pick .track{outline:2px solid var(--ink);outline-offset:1px}
.ev .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tags{font-size:.875rem;color:var(--muted);margin:0 0 0 0}
.fact{border-left:4px solid var(--accent);padding:2px 0 2px 12px;margin-top:14px}
.fact b{font-weight:700}
.trap{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.92rem;margin:10px 0 0}
.crowd{margin:10px 0 0;font-size:.95rem}
.sample{display:inline-block;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:1px 8px;font-size:.875rem;font-weight:700;margin-bottom:6px}

/* result */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .num{font-family:var(--font-display);font-size:4.6rem;line-height:1}
.score .of{font-size:1.1rem;color:var(--muted)}
.style{margin:10px 0 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--accent) 22%,var(--surface));color:var(--ink)}
.style b{font-family:var(--font-display);font-weight:400;font-size:1.2rem}
.grid{display:flex;gap:8px;margin:14px 0}
.tile{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem}
.tile.g{background:var(--good-bg);color:var(--good)}
.tile.y{background:var(--warn-bg);color:var(--warn)}
.tile.r{background:var(--bad-bg);color:var(--bad)}
table.hands{width:100%;border-collapse:collapse;font-size:.92rem}
table.hands th{font-weight:600;text-align:left;color:var(--muted);padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
table.hands td{padding:9px 6px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.hands td:last-child,table.hands th:last-child{text-align:right;padding-right:0}
.stats{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.stats li{display:flex;gap:10px;align-items:baseline}
.stats .k{font-family:var(--font-display);font-size:1.5rem;min-width:62px}
.field{display:flex;gap:8px;margin-top:8px}
.field input{flex:1;min-width:0;padding:10px 12px;border:2px solid var(--line-strong);border-radius:10px;background:var(--surface)}
.err{color:var(--bad);font-size:.9rem;margin-top:6px}
textarea.share{width:100%;border:2px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:10px 12px;resize:none;font-family:ui-monospace,Menlo,monospace;font-size:.9rem}

/* board */
.tabs{display:flex;gap:6px;margin:6px 0 12px}
.tab{flex:1;padding:10px;border-radius:10px;border:2px solid var(--line-strong);background:transparent;font-weight:600}
.tab[aria-selected="true"]{border-color:var(--ink);background:var(--surface)}
table.board{width:100%;border-collapse:collapse}
table.board td,table.board th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
table.board th{font-size:.85rem;color:var(--muted);font-weight:600}
table.board .r{text-align:right;font-variant-numeric:tabular-nums}
table.board tr.me td{background:color-mix(in srgb,var(--accent) 22%,transparent);font-weight:700}
.rank{width:34px;font-family:var(--font-display)}

/* misc */
.rg{margin-top:28px;font-size:.875rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.ph{outline:2px dashed var(--placeholder);outline-offset:2px;color:var(--placeholder);padding:0 4px;border-radius:3px}
details.panel summary{cursor:pointer;font-weight:700}
.about h2{font-size:1.3rem;margin:22px 0 8px}
.about ul{padding-left:1.1em;margin:0 0 .75em}
.about li{margin-bottom:.4em}
.back{margin:4px 0 4px -10px}
.note{background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:10px;padding:10px 12px;font-size:.9rem}

/* ---- layout: phone first, wider screens below ---- */
.top{gap:0 4px;flex-wrap:wrap}
.brand{white-space:nowrap;font-size:1.35rem}
.top .link{padding:8px 8px;font-size:.875rem;white-space:nowrap}
.actions{margin-top:0}
.split>.col-b{margin-top:16px}
.narrow{max-width:680px;margin:0 auto}
.hero-table{margin-bottom:16px}
.factbar{margin-top:20px}
.learn{margin-top:30px}
.learn h2{font-size:1.4rem;margin-bottom:12px}
.learn-grid{display:grid;gap:12px;margin-bottom:14px}
.fact-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px}
details.numbers-d summary{padding:2px 0}
.numbers{display:grid;gap:24px;margin-top:14px}
.numbers h3{font-size:1.05rem;margin-bottom:6px}
table.mini-t{width:100%;border-collapse:collapse;font-size:.9375rem}
table.mini-t th{font-weight:600;text-align:left;padding:4px 10px 4px 0;width:76px;white-space:nowrap}
table.mini-t td{padding:4px 0}
table.mini-t td.bc{width:100%}
table.mini-t td.r{text-align:right;white-space:nowrap;padding-left:10px;font-variant-numeric:tabular-nums}
.mini{display:block;height:12px;border-radius:6px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden}
.mini span{display:block;height:100%;background:var(--accent)}
@media (min-width:600px){
  .wrap{max-width:680px}
}
@media (min-width:960px){
  .wrap{max-width:1160px;padding:0 40px 56px}
  .top{padding:22px 0 18px}
  .brand{font-size:1.75rem}
  .top .link{font-size:1rem;padding:8px 14px}
  .top nav{gap:8px}
  /* two columns on play and result */
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}
  .split>.col-b{margin-top:0}
  .split.play>.col-a{position:sticky;top:20px}
  .split.result{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
  .actions{gap:14px}
  .act{min-height:104px;padding:16px 8px}
  .act b{font-size:1.5rem}
  .act span{font-size:.95rem}
  /* bigger table and cards */
  .table{padding:28px 32px 32px;border-radius:26px}
  .seat-label{font-size:1rem}
  .seat + .seat{margin-top:22px;padding-top:22px}
  .cards{gap:14px}
  .card{width:92px;height:130px;padding:10px 11px;border-radius:11px}
  .card .rk{font-size:2.15rem}
  .card .su{font-size:1.6rem}
  .card .big{font-size:2.5rem;right:11px;bottom:8px}
  .pill{font-size:1.05rem;padding:4px 14px}
  /* home: text left, table right */
  .home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"hero table" "cta table" "fact fact";column-gap:56px;align-items:start}
  .home .hero{grid-area:hero;margin-top:36px}
  .home .hero-table{grid-area:table;margin:36px 0 0}
  .home .cta{grid-area:cta}
  .home .factbar{grid-area:fact;margin-top:32px}
  .hero h1{font-size:3.4rem}
  .hero p{font-size:1.2rem}
  .score .num{font-size:6rem}
  .panel{padding:20px}
  .evs{gap:10px}
  .learn{margin-top:44px}
  .learn-grid{grid-template-columns:1fr 1fr;gap:20px}
  .fact-card{padding:16px 18px;font-size:1.05rem}
  .numbers{grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}
}

/* ---- story, timeline, bonus question ---- */
.table .actions{margin-top:16px}
.table .act{color:var(--ink)}
.table .act span{color:var(--muted)}
.table .ask{margin:18px 0 0}
.story{display:flex;gap:12px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.story .yr{flex:none;font-family:var(--font-display);font-size:.9rem;background:var(--ink);color:var(--page);border-radius:8px;padding:3px 10px;white-space:nowrap;margin-top:1px}
.timeline{list-style:none;margin:10px 0 0;padding:0 0 0 14px;border-left:3px solid var(--accent)}
.timeline li{position:relative;padding:0 0 16px 18px}
.timeline li:last-child{padding-bottom:2px}
.timeline li::before{content:"";position:absolute;left:-24px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
.timeline .yr{display:block;font-family:var(--font-display);font-size:1.05rem;margin-bottom:2px}
.bonus h3,.panel>h3{font-size:1.2rem;margin-bottom:8px}
.opts{display:grid;gap:10px;margin:14px 0}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;min-height:48px;padding:10px 14px;border:2px solid var(--line-strong);border-radius:12px;background:var(--surface);font-weight:500}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default;opacity:1}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);font-weight:700}
.opt .mk{font-weight:800}
.bonus .why{margin:0 0 8px}
.learn-top{display:grid;gap:14px;margin-bottom:14px}
@media (min-width:960px){
  .learn-top{grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .story{padding:14px 16px}
}
</style>
</head>
<body>

  <header class="top">
    <button class="brand" data-go="home" aria-label="Daily Hand home">Daily Hand</button>
    <nav aria-label="Main">

  </header>
  <main id="app" tabindex="-1"></main>
  <footer class="rg"><p style="margin:0">Free to play. No money, chips or prizes are involved. <span class="ph">[Placeholder: responsible gambling wording, pending legal review]</span></p></footer>
  <div id="live" class="sr" aria-live="polite"></div>
</div>

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function upName(u){return u===11?'A':String(u)}
function ev2(n){return (n>=0?'+':'\u2212')+Math.abs(n).toFixed(2)}
function pct(x){return Math.round(x*100)}
function desc(h){return (h.soft?'Soft ':'Hard ')+h.total}
function dayOf(ms){return new Date(ms).toISOString().slice(0,10)}
function today(){return dayOf(Date.now())}
function prevDay(d){return dayOf(Date.parse(d+'T00:00:00Z')-864e5)}
function dayNum(d){return Math.max(1,Math.floor((Date.parse(d+'T00:00:00Z')-CFG.epoch)/864e5)+1)}
function weekStart(d){var t=new Date(d+'T00:00:00Z');var wd=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-wd);return t.toISOString().slice(0,10)}
function niceDate(d){return new Date(d+'T00:00:00Z').toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'})}
function say(t){var l=document.getElementById('live');if(l){l.textContent='';setTimeout(function(){l.textContent=t},30)}}

function xmur(str){var h=1779033703^str.length;for(var i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0}}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rngFor(s){return mulberry(xmur(s)())}

/* ---------- game logic ---------- */
function tier(h){if(!h.trap&&h.gap2>=0.12)return 0;if(h.gap2<0.08)return 2;return 1}
function rankLabel(v,rnd){if(v===11)return 'A';if(v===10)return ['10','J','Q','K'][Math.floor(rnd()*4)];return String(v)}
function mkCard(v,rnd){var s=['♠','♥','♦','♣'][Math.floor(rnd()*4)];return {v:v,r:rankLabel(v,rnd),s:s}}
function deal(h,rnd){
  var a,b;
  if(h.soft){a=11;b=h.total-11}
  else{var opts=[];for(var x=2;x<=10;x++){var y=h.total-x;if(y>=2&&y<=10&&x<y)opts.push([x,y])}
    var o=opts[Math.floor(rnd()*opts.length)];if(rnd()<.5){a=o[0];b=o[1]}else{a=o[1];b=o[0]}}
  return {h:h,player:[mkCard(a,rnd),mkCard(b,rnd)],up:mkCard(h.up,rnd)};
}
function buildDay(seed){
  var rnd=rngFor('dailyhand|'+seed);
  var pools=[0,1,2].map(function(t){return H.filter(function(h){return tier(h)===t})});
  var plan=[0,0,1,1,2], chosen;
  for(var attempt=0;attempt<60;attempt++){
    chosen=[];var seen={};
    for(var k=0;k<plan.length;k++){
      var p=pools[plan[k]],c,g=0;
      do{c=p[Math.floor(rnd()*p.length)];g++}while((seen[c.id]||seen[c.total+'-'+c.soft])&&g<40);
      seen[c.id]=1;seen[c.total+'-'+c.soft]=1;chosen.push(c);
    }
    var kinds={};chosen.forEach(function(c){kinds[c.best]=1});
    if(Object.keys(kinds).length>=2)break;
  }
  return chosen.map(function(h){return deal(h,rnd)});
}
function handScore(h,action){var loss=h.ev[h.best]-h.ev[action];var gap=Math.max(h.spread,CFG.floor);return Math.max(0,100*(1-loss/gap))}
function isRight(h,action){return h.ev[h.best]-h.ev[action]<CFG.tie}
function verdict(h,action){if(isRight(h,action))return 'g';return handScore(h,action)>=50?'y':'r'}
function summarise(deals,codes){

var S={view:underFlag()?'under':'home',round:null,boardTab:'today',nickErr:'',confirmReset:false,focus:null};
var app=document.getElementById('app');

function newRound(mode){
  var day=today(),seed=mode==='daily'?day:'practice|'+Math.random();
  var deals=buildDay(seed);
  var codes=[];
  if(mode==='daily'){var e=SV.days[day];if(e&&Array.isArray(e.a))codes=e.a.slice(0,5)}
  var i=Math.min(codes.length,4),phase='choose',se=SV.days[day];
  if(mode==='daily'&&se&&se.fb&&se.s==null&&codes.length>=1){i=codes.length-1;phase='feedback'}
  return {mode:mode,day:day,deals:deals,facts:pickFacts(deals,mode==='daily'?day:seed),stories:pickStories(mode==='daily'?day:seed),codes:codes,i:i,phase:phase};
}
function startDaily(){
  var e=SV.days[today()];
  if(e&&e.s!=null){go('result');return}
  var r=newRound('daily');
  if(r.codes.length>=5&&r.phase!=='feedback'){finish(r);return}
  if(!SV.days[r.day]){SV.days[r.day]={a:[],ev:{st:Date.now()}};saveLocal()}
  S.round=r;go('play');
}
function startFrom(code){
  var e=SV.days[today()];
  if(e&&e.s!=null){go('result');return}
  var r=newRound('daily');
  if(r.codes.length){startDaily();return}
  SV.days[r.day]=SV.days[r.day]||{a:[],ev:{st:Date.now()}};saveLocal();
  S.round=r;go('play');choose(code);
}
function startPractice(){S.round=newRound('practice');go('play')}
function choose(code){
  var R=S.round;if(!R||R.phase!=='choose')return;
  R.codes[R.i]=code;R.phase='feedback';
  if(R.mode==='daily'){var e=SV.days[R.day]||(SV.days[R.day]={a:[],ev:{st:Date.now()}});e.a=R.codes.slice();e.fb=true;saveLocal()}
  S.focus='fb';render();
}
function next(){
  var R=S.round;if(!R||R.phase!=='feedback')return;
  if(R.mode==='daily'&&SV.days[R.day]){SV.days[R.day].fb=false;saveLocal()}
  if(R.i>=4){finish(R);return}
  R.i++;R.phase='choose';S.focus='hand';render();
}
function finish(R){
  var rows=summarise(R.deals,R.codes),score=dayScore(rows),st=styleOf(rows);
  if(R.mode==='daily'){
    var e=SV.days[R.day]||(SV.days[R.day]={a:[],ev:{st:Date.now()}});
    e.a=R.codes.slice();e.fb=false;e.s=score;e.st=st;e.ev=e.ev||{};e.ev.co=Date.now();e.ev.sh=e.ev.sh||0;e.ev.ei=e.ev.ei||0;
    saveLocal();queueSync();
  }
  S.round=R;R.done={rows:rows,score:score,st:st};go('result');
}

/* ---------- shared db ---------- */
var chain=Promise.resolve();
function queueSync(){chain=chain.then(syncDb).catch(function(){})}
function syncDb(){
  if(!DB||!UID)return Promise.resolve();
  var days={};Object.keys(SV.days).filter(function(d){return SV.days[d].s!=null}).sort().slice(-CFG.keep).forEach(function(d){var e=SV.days[d];days[d]={a:e.a,s:e.s,st:e.st,ev:e.ev||{}}});
  var doc={v:1,nick:validNick(SV.nick)?SV.nick.trim():'',days:days,u:new Date().toISOString()};
  return DB.doc('plays/'+UID).set(doc).then(function(){dbNote=''},function(e){dbNote='Could not save to the shared leaderboard ('+((e&&e.code)||'error')+'). Your result is still saved on this device.'});
}
function mergeFromDb(){
  var mine=PLAYS.filter(function(p){return p.id===UID})[0],changed=false,needPush=false;
  if(mine&&mine.data){
    var d=mine.data.days||{};
    Object.keys(d).forEach(function(k){if(!(SV.days[k]&&SV.days[k].s!=null)&&d[k]&&d[k].s!=null){SV.days[k]=d[k];changed=true}});
    if(!SV.nick&&mine.data.nick){SV.nick=mine.data.nick;changed=true}
  }
  var dd=(mine&&mine.data&&mine.data.days)||{};
  Object.keys(SV.days).forEach(function(k){if(SV.days[k].s!=null&&!(dd[k]&&dd[k].s!=null))needPush=true});
  if(changed)saveLocal();
  if(needPush)queueSync();
}
function softRefresh(){
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(S.view==='result'||S.view==='board'||S.view==='home'){var y=window.scrollY;S.focus=null;render();window.scrollTo(0,y)}
}
function initDb(){
  try{
    if(!window.claude||!window.claude.use){dbState='off';return}
    Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
      var db=r[0],user=r[1];
      if(!db||!user){dbState='off';softRefresh();return}
      return user.id().then(function(id){
        if(!id){dbState='off';softRefresh();return}
        UID=id;DB=db;dbState='ready';
        db.collection('plays').limit(1000).onSnapshot(function(snap){
          PLAYS=snap.docs.map(function(d){return {id:d.id,data:d.data()}});mergeFromDb();softRefresh();
        },function(){dbState='off';softRefresh()});
      });
    }).catch(function(){dbState='off';softRefresh()});
  }catch(e){dbState='off'}
}

  PLAYS.forEach(function(p){
    var d=p.data;if(!d||!d.days||!validNick(d.nick))return;
    if(tab==='today'){var e=d.days[day];if(e&&typeof e.s==='number'&&Array.isArray(e.a)&&e.a.length===5)rows.push({id:p.id,nick:d.nick.trim(),v:e.s,sub:''})}
    else{var tot=0,n=0;Object.keys(d.days).forEach(function(k){if(weekStart(k)===wk&&typeof d.days[k].s==='number'){tot+=d.days[k].s;n++}});if(n)rows.push({id:p.id,nick:d.nick.trim(),v:tot,n:n,avg:tot/n})}
  });
  rows.sort(function(a,b){return b.v-a.v||((b.avg||0)-(a.avg||0))||a.nick.localeCompare(b.nick)});
  return rows;
}
function vBoard(){
  var tab=S.boardTab,rows=boardRows(tab),day=today();
  var head='<h1 style="font-size:1.9rem;margin:6px 0 4px">Leaderboard</h1><p class="small muted">Same five hands for everyone, so rank is a fair read on skill. No prizes.</p>'
    +'<div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="today" aria-selected="'+(tab==='today')+'">Today</button><button class="tab" role="tab" data-tab="week" aria-selected="'+(tab==='week')+'">This week</button></div>';
  if(dbState!=='ready')return head+'<div class="note">'+(dbState==='pending'?'Connecting to the shared board\u2026':'The leaderboard needs a signed-in viewer with shared data. Open the page from your Claude workspace to see it.')+'</div>';
  var played=SV.days[day]&&SV.days[day].s!=null;
  var body;
  if(!rows.length)body='<div class="note">No one is on this board yet. '+(played?'Pick a nickname on your result screen to be first.':'Play today\u2019s five and pick a nickname to be first.')+'</div>';
  else{
    var top=rows.slice(0,20),meIdx=rows.map(function(r){return r.id}).indexOf(UID);
    var list=top.map(function(r,i){return rowHtml(r,i+1,tab)});
    if(meIdx>=20)list.push('<tr><td colspan="3" class="muted small">\u2026</td></tr>'+rowHtml(rows[meIdx],meIdx+1,tab));
    body='<table class="board"><caption class="sr">'+(tab==='today'?'Today':'This week')+'</caption><thead><tr><th class="rank" scope="col">#</th><th scope="col">Player</th><th class="r" scope="col">'+(tab==='today'?'Score':'Week total')+'</th></tr></thead><tbody>'+list.join('')+'</tbody></table>'
      +(tab==='week'?'<p class="small muted" style="margin-top:10px">Week total adds your daily scores from Monday (UTC). It rewards coming back, so a full week tops out at 700.</p>':'');
  }
  var mine=!validNick(SV.nick)&&played?'<p class="small" style="margin-top:12px">You are not on the board yet. <button class="link" data-go="result" style="padding:2px 4px">Pick a nickname</button></p>':'';
  return head+body+mine;
}
function rowHtml(r,rank,tab){
  var me=r.id===UID;
  var val=tab==='today'?Math.round(r.v)+'%':Math.round(r.v)+'<span class="small muted"> ('+r.n+' day'+(r.n===1?'':'s')+')</span>';
  return '<tr class="'+(me?'me':'')+'"><td class="rank">'+rank+'</td><td>'+esc(r.nick)+(me?' (you)':'')+'</td><td class="r">'+val+'</td></tr>';
}
function vAbout(){
  var reset=S.confirmReset?'<button class="btn ghost" data-act="reset-yes">Yes, reset my data</button> <button class="link" data-act="reset-no">Cancel</button>':'<button class="btn ghost" data-act="reset">Reset my data (testing)</button>';
  return '<section class="about"><h1 style="font-size:1.9rem;margin:6px 0 4px">How it\u2019s scored</h1>'
  +'<p class="muted">This is a prototype spec you can play. Numbers come from an expected-value engine, not from memory.</p>'
  +'<h2>The rules</h2><ul><li>Large-shoe approximation (infinite deck), dealer stands on all 17s, dealer checks for blackjack.</li><li>Double on any two cards. No splits, no surrender, no doubling after a hit.</li><li>Pairs are left out for now, since they need a Split button. The pool is '+H.length+' decisive hands; near-ties such as hard 16 against a 10 are excluded.</li></ul>'
  +'<h2>Your score</h2><ul><li>Each option has an expected value: the average result per hand over many hands.</li><li>Per hand: 100 \u00D7 (1 \u2212 value you gave away \u00F7 gap between the best and worst option). Best play scores 100, the worst option scores 0, and a close second scores close to 100. On the few hands where all three options are nearly equal, a minimum gap of 0.15 stops a tiny slip from looking like a disaster.</li><li>Any option within 0.01 of the best counts as right.</li><li>The percentage is a score out of 100 built hand by hand. It is not a share of expected value.</li><li>The five hands are weighted 1, 1, 1.5, 1.5 and 2, so the harder hands matter more. Your headline number is the weighted average.</li><li>A grid tile is a tick for best play, a tilde at 50% or more, and a cross below that.</li></ul>'
  +'<h2>Player stats</h2><ul><li>Percentages appear only after '+CFG.minSample+' players have answered, so two people never become \u201C100% of players\u201D.</li><li>They describe today\u2019s players who finished and chose to play, not people in general.</li><li>Player stats appear after you answer, so they cannot influence your choice.</li></ul>'
  +'<h2>Known limits of this prototype</h2><ul><li>One play per day is kept on this device and your signed-in account. A determined player could bypass it. A real build needs a server-side limit.</li><li>Scores are written by the player\u2019s own browser, so the leaderboard trusts clients.</li><li>Basic strategy charts are public, so someone can look up the answers. That is why the weekly board is the main one.</li><li>The nickname filter is a basic word list. A public launch needs real moderation.</li><li>Facts marked for review in the fact bank have not been source-checked.</li></ul>'
  +(DEBUG?'<h2>Tools</h2><div class="stack"><div><button class="btn ghost" data-act="sample">'+(SAMPLE?'Turn off sample data preview':'Preview player stats with sample data')+'</button><p class="small muted" style="margin-top:6px">Shows how the percentages look once enough players exist. Everything shown this way is labelled \u201CSample data\u201D and is never saved.</p></div><div>'+reset+'</div></div>':'')+'</section>';
}
function render(){
  var v=S.view;
  var html,narrow=false;
  if(underFlag()){html=vUnder();narrow=true}
  else if(!SV.age&&v!=='under'){html=vGate();narrow=true}
  else{html={home:vHome,play:vPlay,result:vResult,board:vBoard,about:vAbout,under:vUnder}[v]();narrow=(v==='board'||v==='about'||v==='under')}
  app.innerHTML=narrow?'<div class="narrow">'+html+'</div>':html;
  document.getElementById('nav-board').setAttribute('aria-current',v==='board'?'page':'false');
  document.getElementById('nav-about').setAttribute('aria-current',v==='about'?'page':'false');
  var f=S.focus;S.focus=null;
  if(f==='fb'){var el=document.getElementById('fb');if(el){el.focus({preventScroll:false})}}
  else if(f==='hand'){var h=document.getElementById('hand-h');if(h)h.focus({preventScroll:true})}
  else if(f==='main'){app.focus({preventScroll:true})}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-act],[data-choose],[data-tab],[data-start],[data-bq]');if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.choose){choose(t.dataset.choose);return}
  if(t.dataset.start){startFrom(t.dataset.start);return}
  if(t.dataset.bq!==undefined){
    var R=S.round;if(!R)return;var qi=+t.dataset.bq;
    if(R.mode==='daily'){var de=SV.days[R.day];if(de&&de.bq==null){de.bq=qi;saveLocal()}}else if(R.bq==null)R.bq=qi;
    var y=window.scrollY;S.focus=null;render();window.scrollTo(0,y);
    var w=document.getElementById('bq-why');if(w)w.focus({preventScroll:true});
    return;
  }
  if(t.dataset.tab){S.boardTab=t.dataset.tab;S.focus=null;render();return}
  var a=t.dataset.act;
  if(a==='age-yes'){SV.age=true;saveLocal();render()}
  else if(a==='age-no'){try{sessionStorage.setItem('dailyhand.under','1')}catch(x){}S.view='under';render()}
  else if(a==='play')startDaily();
  else if(a==='see-result')go('result');
  else if(a==='practice')startPractice();
  else if(a==='next')next();
  else if(a==='copy'){
    var ta=document.getElementById('sharetext'),txt=ta.value,done=function(){say('Copied. Paste it anywhere to share.');var e2=SV.days[S.round.day];if(S.round.mode==='daily'&&e2){e2.ev=e2.ev||{};e2.ev.sh=(e2.ev.sh||0)+1;saveLocal();queueSync()}};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){ta.select();say('Select the text and copy it.')});return}}catch(x){}
    ta.focus();ta.select();say('Select the text and copy it.');
  }
  else if(a==='nick'){
    var v=(document.getElementById('nick').value||'').trim();
    if(!validNick(v)){S.nickErr='Use 3 to 16 letters, numbers, spaces, hyphens or underscores, and keep it friendly.';render();return}
    SV.nick=v;saveLocal();S.nickErr='';queueSync();render();say('You are on the leaderboard.');
  }
  else if(a==='email-intent'){var e3=SV.days[today()];if(e3){e3.ev=e3.ev||{};e3.ev.ei=(e3.ev.ei||0)+1;saveLocal();queueSync();render()}}
  else if(a==='sample'){SAMPLE=!SAMPLE;render()}
  else if(a==='reset'){S.confirmReset=true;render()}
  else if(a==='reset-no'){S.confirmReset=false;render()}
  else if(a==='reset-yes'){
    SV={age:SV.age,nick:'',days:{}};saveLocal();S.round=null;S.confirmReset=false;
    if(DB&&UID)DB.doc('plays/'+UID).delete().catch(function(){});
    go('home');say('Your data was reset.');
  }
});
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
  if(S.view==='play'&&S.round&&S.round.phase==='choose'){
    var k=e.key.toLowerCase();if(e.repeat||!(e.target&&e.target.closest&&e.target.closest('.actions')))return;
    if(k==='h'||k==='s'||k==='d'){e.preventDefault();choose(k.toUpperCase())}
  }
});
document.addEventListener('keypress',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='nick'){e.preventDefault();var b=document.querySelector('[data-act="nick"]');if(b)b.click()}});

render();
initDb();
})();
</script>
